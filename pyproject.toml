[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uvm"
version = "0.1.0"
description = "Ассемблер и интерпретатор учебной виртуальной машины (вариант 26)"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
uvm-asm = "uvm.assembler:main"

[tool.setuptools]
packages = ["uvm"]